name: Tests

on:
  push:
    branches:
      - main
      - "*.x"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        # BOTH platforms, deliberately. This package's whole claim is about
        # path containment, and the two operating systems disagree about
        # almost every part of it: case sensitivity, reserved device names,
        # the path length ceiling, and whether a symlink can be created at
        # all. A green run on one says nothing about the other.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npx vitest run
